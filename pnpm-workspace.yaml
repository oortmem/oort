packages:
  - 'packages/*'
allowBuilds:
  esbuild: true
  # Its install script only fetches CUDA libraries (Linux x64) from NuGet; Oort runs on the CPU.
  onnxruntime-node: false
# Supply-chain hold-backs (pnpm settings, explicit rather than relying on defaults).
# One day, not seven: the AI SDK packages this repo pins were published 2026-11-03.
minimumReleaseAge: 1440
blockExoticSubdeps: true
trustPolicy: no-downgrade
