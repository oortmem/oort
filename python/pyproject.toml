[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "oortmem"
version = "0.6.3"
description = "Open-source memory for AI agents: the native Python client (Oort, AsyncOort) and the oort CLI launcher."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "Oort" }]
keywords = ["ai", "agents", "memory", "agent-memory", "mcp", "claude", "llm", "rag"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://oortcloud.dev"
Source = "https://github.com/oortmem/oort"
Documentation = "https://oortcloud.dev/docs"

[project.scripts]
oort = "oortmem.cli:main"
oortmem = "oortmem.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oortmem"]
