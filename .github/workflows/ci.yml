name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # Python: 3.10 is the client's floor (pnpm verify runs the client, the shared contract suite
      # and the integration test on it), 3.13 the newest checked, 3.9 the launcher's floor.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: |
            3.9
            3.13
            3.10
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
        env:
          OORT_PYTHON: python3.10
      - name: Python tests on 3.13 (client) and 3.9 (launcher only)
        run: |
          python3.13 -m unittest discover -s python/tests -v
          python3.9 -m unittest discover -s python/tests -v
      # The framework examples (LangGraph, OpenAI Agents, CrewAI) against the built `oort serve`,
      # each in its own venv from its hash-locked requirements (about 1.5 minutes in all, most
      # of it CrewAI's install). Python 3.13: crewai supports <3.14. Never skipped here.
      - name: Python framework examples on 3.13
        env:
          OORT_REQUIRE_FRAMEWORKS: '1'
        run: |
          for f in langgraph openai-agents crewai; do
            python3.13 -m venv "/tmp/venv-$f"
            "/tmp/venv-$f/bin/pip" install --require-hashes -r "examples/python/requirements/$f.txt"
            "/tmp/venv-$f/bin/pip" install --no-deps ./python
            OORT_FRAMEWORKS="$f" "/tmp/venv-$f/bin/python" -m unittest discover -s python/tests -p test_frameworks.py -v
          done
      - name: The Python package builds a wheel that imports
        run: |
          python3.10 -m pip install build==1.6.1
          python3.10 -m build python --outdir /tmp/oortmem-dist
          python3.10 -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install /tmp/oortmem-dist/*.whl
          /tmp/wheel-venv/bin/python -c 'from oortmem import Oort, AsyncOort, format_for_prompt; import oortmem.types'
          /tmp/wheel-venv/bin/oort --launcher-version
      - name: Build the Claude Desktop bundle (not published)
        run: pnpm bundle:mcpb
