name: PyPI

# Publishes the `oortmem` Python launcher (python/) to PyPI when a v* tag is pushed, or by hand.
# No PyPI token exists: PyPI trusts this workflow through OIDC (trusted publishing, pending
# publisher oortmem/oort, workflow pypi.yml, environment pypi), and the `pypi` environment
# requires Marcus's approval. Build and publish are separate jobs so the build never holds the
# publishing credential.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Version matches the tag and every npm package
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          v=$(python -c 'import tomllib;print(tomllib.load(open("python/pyproject.toml","rb"))["project"]["version"])')
          if [ "$REF_TYPE" = tag ] && [ "${REF_NAME#v}" != "$v" ]; then
            echo "tag $REF_NAME does not match python/pyproject.toml $v"; exit 1
          fi
          node scripts/release-check.mjs "$v"
      - run: python -m unittest discover -s python/tests -v
      - run: python -m pip install build==1.6.1
      - run: python -m build python --outdir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
