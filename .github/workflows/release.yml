name: Release

# Publishes every package in packages/* (except the private bench) to npm when a v* tag is pushed.
# No npm token exists: npm trusts this workflow through OIDC (trusted publishing) and attaches a
# provenance statement to each package. The `npm` environment requires Marcus's approval.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# No workflow-level concurrency: publish has its own group (below). A run-wide group would be
# held by native-darwin-check while it waits for a macOS runner (timeout-minutes does not count
# queue time, and a job can queue for up to 24 hours), and a later tag's run would wait behind it.

jobs:
  # The native RaBitQ engine (CON-25), one binary per platform, built from source. They ship
  # inside @oortmem/store-sqlite (native/oort-rabitq.<tag>.node); any other platform runs the
  # TypeScript engine. Linux builds on a runner of that platform, Ubuntu 22.04 (glibc 2.35), so
  # the binaries load on that glibc or newer. darwin-arm64 is cross-compiled on Ubuntu with
  # cargo-zigbuild (zig as the linker, with its own macOS libSystem stubs; the crate links no
  # Apple framework), so a release does not wait for a hosted macOS arm64 runner. That binary is
  # loaded and tested on macOS afterwards, by native-darwin-check below.
  native:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-22.04, tag: darwin-arm64, cross: aarch64-apple-darwin }
          - { os: ubuntu-22.04, tag: linux-x64-gnu }
          - { os: ubuntu-22.04-arm, tag: linux-arm64-gnu }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # Every cargo and rustc call in this job runs in native/, so rustup uses the toolchain
      # rust-toolchain.toml pins. --pinned-toolchain prints `rustc --version` and fails the step if
      # it is not that version.
      - name: Rust tests, then the release binary
        if: matrix.cross == ''
        working-directory: packages/store-sqlite/native
        env:
          TAG: ${{ matrix.tag }}
        run: |
          rustup toolchain install
          node ../scripts/build-native.mjs --pinned-toolchain --toolchain-only
          cargo test --locked
          node ../scripts/build-native.mjs --require --pinned-toolchain
          test -f "oort-rabitq.$TAG.node"
      # zig and cargo-zigbuild for the cross build, each pinned by version and SHA-256 (zig's from
      # ziglang.org/download/index.json, cargo-zigbuild's from its release's .sha256 file).
      - name: Install zig and cargo-zigbuild
        if: matrix.cross != ''
        env:
          ZIG_VERSION: 0.17.0
          ZIG_SHA256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
          ZIGBUILD_VERSION: 0.24.0
          ZIGBUILD_SHA256: 52be2cb85ad3875682564a29bac1832b2ab3db68b1c504765c92d5249cc9b96f
        run: |
          mkdir -p "$RUNNER_TEMP/cross" && cd "$RUNNER_TEMP/cross"
          curl -sSfL --retry 3 -o zig.tar.xz \
            "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
          echo "$ZIG_SHA256  zig.tar.xz" | sha256sum -c -
          zigbuild_url="https://github.com/rust-cross/cargo-zigbuild/releases/download/v$ZIGBUILD_VERSION"
          curl -sSfL --retry 3 -o cargo-zigbuild.tar.xz \
            "$zigbuild_url/cargo-zigbuild-x86_64-unknown-linux-musl.tar.xz"
          echo "$ZIGBUILD_SHA256  cargo-zigbuild.tar.xz" | sha256sum -c -
          tar -xJf zig.tar.xz && tar -xJf cargo-zigbuild.tar.xz
          echo "$RUNNER_TEMP/cross/zig-x86_64-linux-$ZIG_VERSION" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/cross/cargo-zigbuild-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      # Run inside native/ so rustup applies rust-toolchain.toml and adds the target to that
      # toolchain. MACOSX_DEPLOYMENT_TARGET is rustc's own default for aarch64-apple-darwin (11.0);
      # without it zig would link for its newer default. The Rust tests ran on the Linux legs.
      - name: Cross-compile the release binary
        if: matrix.cross != ''
        working-directory: packages/store-sqlite/native
        env:
          TARGET: ${{ matrix.cross }}
          TAG: ${{ matrix.tag }}
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          zig version && cargo-zigbuild --version
          rustup toolchain install
          node ../scripts/build-native.mjs --pinned-toolchain --toolchain-only
          rustup target add "$TARGET"
          node ../scripts/build-native.mjs --require --pinned-toolchain --zig --target "$TARGET"
      # What can be checked without macOS, before upload, so a failure here stops the release: an
      # arm64 Mach-O whose page hashes match its code signature (macOS refuses to map an arm64
      # binary otherwise) and that exports the entry point Node calls. llvm-nm comes from the
      # llvm-tools component of the toolchain rust-toolchain.toml pins.
      - name: Check the cross-built binary's signature and entry point
        if: matrix.cross != ''
        working-directory: packages/store-sqlite/native
        env:
          TAG: ${{ matrix.tag }}
        run: |
          file -b "oort-rabitq.$TAG.node"
          node ../scripts/check-macho-signature.mjs "oort-rabitq.$TAG.node"
          rustup component add llvm-tools
          host="$(rustc -vV | sed -n 's/^host: //p')"
          llvm_nm="$(rustc --print sysroot)/lib/rustlib/$host/bin/llvm-nm"
          "$llvm_nm" --extern-only --defined-only "oort-rabitq.$TAG.node" \
            | grep -w _napi_register_module_v1
      # The binary as it will ship, loaded by Node on its own platform: the engine tests and the
      # store's RaBitQ suites (conformance included) fail here rather than fall back. The
      # cross-built darwin binary cannot load on Linux; native-darwin-check tests it on macOS.
      - name: Load and test the binary on this platform
        if: matrix.cross == ''
        env:
          OORT_REQUIRE_NATIVE: '1'
        run: |
          pnpm --filter '@oortmem/store-sqlite...' build
          pnpm vitest run packages/store-sqlite/src/rabitq.test.ts packages/store-sqlite/src/rabitq-index.test.ts
      - name: Checksum
        working-directory: packages/store-sqlite/native
        run: shasum -a 256 "oort-rabitq.${{ matrix.tag }}.node" | tee "oort-rabitq.${{ matrix.tag }}.node.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.tag }}
          path: |
            packages/store-sqlite/native/oort-rabitq.${{ matrix.tag }}.node
            packages/store-sqlite/native/oort-rabitq.${{ matrix.tag }}.node.sha256
          if-no-files-found: error

  # The cross-built darwin-arm64 binary, loaded and tested on macOS: the same suites as the Linux
  # legs, with OORT_REQUIRE_NATIVE=1, on the exact file the build job hashed. It is left out of
  # attest's and publish's needs on purpose, so a release never waits on macOS runner capacity.
  # It does not use continue-on-error: a failure here turns the run red (the binary that
  # shipped did not load or failed its tests on macOS) without having blocked publish, which is
  # the signal to follow up with a patch release. Until then, a binary that does not load on
  # macOS leaves the store on the TypeScript engine (same results, slower scan). While this job
  # waits for a runner it holds no concurrency group, so later tags still release.
  native-darwin-check:
    needs: native
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-darwin-arm64
          path: packages/store-sqlite/native
      - name: The binary is the one the build job hashed, and is signed and exports its entry point
        working-directory: packages/store-sqlite/native
        run: |
          shasum -a 256 -c oort-rabitq.darwin-arm64.node.sha256
          codesign --verify --verbose oort-rabitq.darwin-arm64.node
          nm -gU oort-rabitq.darwin-arm64.node | grep -w _napi_register_module_v1
      - name: Load and test the binary on macOS
        env:
          OORT_REQUIRE_NATIVE: '1'
        run: |
          pnpm --filter '@oortmem/store-sqlite...' build
          pnpm vitest run packages/store-sqlite/src/rabitq.test.ts packages/store-sqlite/src/rabitq-index.test.ts

  # Attests the three binaries' build provenance. Its own job, so the job that ran the build (and
  # the dependencies' build scripts) never holds the OIDC token that signs: this one checks out
  # nothing and runs no project code, only the hash check and the attest action.
  attest:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # signs the provenance through Sigstore
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: native
          merge-multiple: true
      - name: Each binary is the one its build job hashed
        working-directory: native
        run: |
          for tag in darwin-arm64 linux-x64-gnu linux-arm64-gnu; do
            shasum -a 256 -c "oort-rabitq.$tag.node.sha256"
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            native/oort-rabitq.darwin-arm64.node
            native/oort-rabitq.linux-x64-gnu.node
            native/oort-rabitq.linux-arm64-gnu.node

  # One publish at a time, across runs: only this job is in the `release` group, so a run whose
  # native-darwin-check is still queued does not hold it.
  publish:
    needs: [native, attest]
    concurrency:
      group: release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
      attestations: read # gh attestation verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11.20.0 && npm --version
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: packages/store-sqlite/native
          merge-multiple: true
      - name: Every native binary is there, as its build job hashed it (the pack ships all three)
        working-directory: packages/store-sqlite/native
        run: |
          for tag in darwin-arm64 linux-x64-gnu linux-arm64-gnu; do
            test -f "oort-rabitq.$tag.node" || { echo "missing $tag"; exit 1; }
            shasum -a 256 -c "oort-rabitq.$tag.node.sha256"
          done
          ls -l *.node
      # The hash only proves the file was not changed in transit between jobs; the attestation
      # proves this workflow, in this repository, at this tag, built it.
      - name: Every native binary carries this release's build provenance
        working-directory: packages/store-sqlite/native
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in darwin-arm64 linux-x64-gnu linux-arm64-gnu; do
            gh attestation verify "oort-rabitq.$tag.node" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners
          done
      - name: Tag matches every package version
        run: node scripts/release-check.mjs "${GITHUB_REF_NAME#v}"
      - run: pnpm verify
        env:
          OORT_REQUIRE_NATIVE: '1' # the linux-x64-gnu binary from the native job
      - name: Pack (pnpm resolves workspace:* to the release version)
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          pnpm -r --filter './packages/*' --filter '!@oortmem/bench' pack --pack-destination "$RUNNER_TEMP/pack"
          ls -l "$RUNNER_TEMP/pack"
      - name: Publish in dependency order (skips versions already on npm)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          v="${VERSION#v}"
          for name in core store-sqlite writer decide-jev embed-voyage rerank-voyage claude-code mcp; do
            pkg="@oortmem/$name"; file="$RUNNER_TEMP/pack/oortmem-$name-$v.tgz"
            if npm view "$pkg@$v" version >/dev/null 2>&1; then echo "skip $pkg@$v (already published)"; continue; fi
            npm publish "$file" --access public --provenance
          done
          if npm view "oortmem@$v" version >/dev/null 2>&1; then echo "skip oortmem@$v"; else
            npm publish "$RUNNER_TEMP/pack/oortmem-$v.tgz" --access public --provenance
          fi
          # @oortmem/local-models is optional and newer than the trust setup: npm trusted publishing
          # only works for a package that already exists, so its first version is published by hand
          # (then scripts/npm-trust.sh). Until then it is skipped here, never failing the release.
          lm="$RUNNER_TEMP/pack/oortmem-local-models-$v.tgz"
          if npm view "@oortmem/local-models@$v" version >/dev/null 2>&1; then echo "skip @oortmem/local-models@$v"
          elif npm view "@oortmem/local-models" name >/dev/null 2>&1; then npm publish "$lm" --access public --provenance
          else echo "::warning::@oortmem/local-models is not on npm yet: publish $v by hand once, then run scripts/npm-trust.sh"; fi
